# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Cars CRUD Tests

# Trigger 1: pull requests that target main -> test only, never publish.
# Trigger 2: pushes to main (i.e. a merged PR) -> test, then publish if the tests pass.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Minimal token: the workflow only ever reads repository contents.
permissions:
  contents: read

jobs:
  tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install requirements-dev.txt
      run: python -m pip install -r requirements-dev.txt

    - name: Install Chromium and its Linux dependencies
      run: python -m playwright install --with-deps chromium

    - name: Run unit tests
      run: python -m pytest tests/unit -q

    - name: Run integration tests
      run: python -m pytest tests/integration -q

    - name: Run API tests
      run: python -m pytest tests/api -q

    - name: Run E2E tests
      run: python -m pytest tests/e2e -q

  publish:

    needs: tests
    
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
    - name: Check out the code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Authenticate to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push the image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/cars-crud:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/cars-crud:${{ github.sha }}

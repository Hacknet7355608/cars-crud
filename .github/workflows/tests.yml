# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Cars CRUD Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets you start a run by hand from the Actions tab. It only appears once
  # this file exists on the default branch (main).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    
    - name: Install requirements-dev.txt
      run: python -m pip install -r requirements-dev.txt
      
    - name: Install Chromium and its Linux dependencies
      run: python -m playwright install --with-deps chromium
    
    - name: Run unit tests
      run: python -m pytest tests/unit -q

    - name: Run integration tests
      run: python -m pytest tests/integration -q

    - name: Run API tests
      run: python -m pytest tests/api -q

    - name: Run E2E tests
      run: python -m pytest tests/e2e -q
